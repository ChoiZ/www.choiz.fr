<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Parcours d'un mail dans le filtre : connu, authentifié ou rejeté">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- arrows -->
  <g stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="175" y1="59"  x2="175" y2="108"/>
    <line x1="285" y1="135" x2="318" y2="135"/>
    <line x1="175" y1="160" x2="175" y2="238"/>
    <line x1="285" y1="265" x2="318" y2="265"/>
    <line x1="175" y1="290" x2="175" y2="364"/>
    <line x1="175" y1="424" x2="175" y2="468"/>
    <line x1="175" y1="514" x2="175" y2="558"/>
  </g>

  <!-- edge labels -->
  <g font-size="12" fill="#6b7280" font-style="italic">
    <text x="300" y="128">oui</text>
    <text x="185" y="204">non</text>
    <text x="300" y="258">non</text>
    <text x="185" y="332">oui</text>
  </g>

  <g font-size="15" text-anchor="middle">
    <!-- start -->
    <rect x="75"  y="15"  width="200" height="44" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="175" y="42" fill="#1f2937">Un mail arrive</text>

    <!-- decision 1 -->
    <rect x="65"  y="110" width="220" height="50" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="175" y="140" fill="#1f2937">Expéditeur connu&#160;?</text>

    <!-- branch: known -> delivered -->
    <rect x="318" y="110" width="212" height="50" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="424" y="140" fill="#065f46">Délivré directement</text>

    <!-- decision 2 -->
    <rect x="65"  y="240" width="220" height="50" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="175" y="270" fill="#1f2937">Message authentifié&#160;?</text>

    <!-- branch: not authenticated -> rejected -->
    <rect x="318" y="236" width="212" height="58" rx="8" fill="#fef2f2" stroke="#ef4444"/>
    <text x="424" y="260" fill="#991b1b">Rejeté</text>
    <text x="424" y="280" fill="#991b1b" font-size="13">(aucun défi envoyé)</text>

    <!-- held + challenge -->
    <rect x="40"  y="364" width="270" height="60" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="175" y="388" fill="#1f2937">Mis en attente</text>
    <text x="175" y="408" fill="#1f2937" font-size="13">email de vérification (lien + captcha)</text>

    <!-- solves -->
    <rect x="55"  y="468" width="240" height="46" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="175" y="496" fill="#1f2937">L'expéditeur résout l'épreuve</text>

    <!-- validated -->
    <rect x="60"  y="558" width="230" height="60" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="175" y="582" fill="#065f46">Validé : message délivré</text>
    <text x="175" y="602" fill="#065f46" font-size="13">(les suivants passent)</text>
  </g>
</svg>
